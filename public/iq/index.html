<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LALCO Reasoning Test</title>
<link rel="stylesheet" href="/shared.css">
<style>
body{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.portal{min-height:100vh; display:flex; flex-direction:column;}
.ptop{position:sticky; top:0; z-index:5; background:var(--paper-raised); border-bottom:1px solid var(--line); padding:12px 16px;}
.ptop .row1{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.pbrand{display:flex; align-items:center; gap:8px; font-family:Georgia,serif; font-weight:600; font-size:14px;}
.pbrand .mark{width:26px; height:26px; border-radius:6px; background:linear-gradient(155deg,var(--gold),#8a6a22);}
.timer{font-family:Georgia,serif; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums;}
.timer.low{color:var(--danger);}
/* English | ລາວ. Both stay visible so a candidate can see which language they
   are in and change it in one tap, at any point in the test. */
.langswitch{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
.langswitch button{background:var(--paper); border:none; padding:7px 11px; font-size:12.5px; font-weight:600; color:var(--text-mute); cursor:pointer; min-height:36px;}
.langswitch button.active{background:var(--gold); color:#20160a;}
.langswitch button:disabled{opacity:.55; cursor:default;}
/* Progress. A plain bar plus "Question X of Y": the candidate always knows how
   much is left without having to count. */
.progress{height:6px; border-radius:3px; background:var(--line-soft); overflow:hidden;}
.progress > span{display:block; height:100%; background:var(--gold); transition:width .2s;}
.pmeta{display:flex; justify-content:space-between; font-size:12px; color:var(--text-mute); margin-bottom:6px;}
.pbody{flex:1; max-width:640px; margin:0 auto; width:100%; padding:20px 16px 110px;}
.qstem{font-size:16px; line-height:1.65; white-space:pre-wrap; margin-bottom:16px;}
.qcat{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text-mute); margin-bottom:8px;}
/* The whole row is the tap target, not just the dot. 48px keeps it usable on a
   phone held one-handed. */
.qopt{display:flex; align-items:flex-start; gap:11px; border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:9px; cursor:pointer; background:var(--paper-raised); min-height:48px;}
.qopt input{width:20px; height:20px; margin-top:1px; flex-shrink:0;}
.qopt.checked{border-color:var(--gold); background:var(--warning-bg);}
.qoptval{font-weight:700; min-width:18px; color:var(--text-mute);}
.pnav{position:fixed; left:0; right:0; bottom:0; background:var(--paper-raised); border-top:1px solid var(--line); padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; justify-content:space-between; max-width:640px; margin:0 auto;}
.pnav .btn{flex:1; justify-content:center; min-height:46px;}
.notice{border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--warning-bg); font-size:13px; margin-bottom:14px;}
.summary{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px;}
.summary th,.summary td{border-bottom:1px solid var(--line-soft); padding:7px 6px; text-align:left;}
input,select,textarea{font-size:16px;}
@media (max-width:480px){.pbody{padding:16px 14px 110px;} .qstem{font-size:15.5px;}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/iq/app.js"></script>
</body>
</html>
