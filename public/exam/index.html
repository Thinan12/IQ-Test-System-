<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LALCO Assessment</title>
<link rel="stylesheet" href="/shared.css">
<style>
body{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.portal{min-height:100vh; display:flex; flex-direction:column;}
.ptop{position:sticky; top:0; z-index:5; background:var(--paper-raised); border-bottom:1px solid var(--line); padding:12px 16px;}
.ptop .row1{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.pbrand{display:flex; align-items:center; gap:8px; font-family:Georgia,serif; font-weight:600; font-size:14px;}
.pbrand .mark{width:26px; height:26px; border-radius:6px; background:linear-gradient(155deg,var(--gold),#8a6a22);}
.timer{font-family:Georgia,serif; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums;}
/* English | ລາວ switcher. Both options stay visible so a candidate can see at
   a glance which language they are in and change it in one tap. */
.langswitch{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
.langswitch button{background:var(--paper); border:none; padding:7px 11px; font-size:12.5px; font-weight:600; color:var(--text-mute); cursor:pointer; min-height:36px;}
.langswitch button.active{background:var(--gold); color:#20160a;}
.langswitch button:disabled{opacity:.55; cursor:default;}
.timer.low{color:var(--danger);}
.pbody{flex:1; max-width:640px; margin:0 auto; width:100%; padding:20px 16px 110px;}
.qopt{display:flex; align-items:flex-start; gap:11px; border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:9px; cursor:pointer; background:var(--paper-raised);}
.qopt input{width:20px; height:20px; margin-top:1px; flex-shrink:0;}
.qopt.checked{border-color:var(--gold); background:var(--warning-bg);}
/* Flag for review. Deliberately not shaped like Next/Previous and kept out of
   the sticky nav bar, so it can never be tapped by someone reaching for the
   button that moves on or submits. Touch target stays 44px on a phone. */
.flagrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 4px; padding-top:14px; border-top:1px solid var(--line-soft);}
.flagbtn{min-height:44px;}
.flagbtn .flagmark{font-size:15px; line-height:1;}
.flagbtn.on{border-color:var(--warning); background:var(--warning-bg); color:var(--warning);}
.flagbtn:disabled{opacity:.6; cursor:default;}
/* Submission receipt. On screen it is a plain card; on paper everything else
   — the header, the language switch, the buttons — drops away and only the
   confirmation remains. Both scripts are rendered by the browser, so Lao and
   English print with the fonts already on the machine. */
.receipt{max-width:420px; margin:18px auto 0; border:1px solid var(--line); border-radius:8px; padding:16px; background:var(--paper-raised);}
.receipthead{font-family:Georgia,serif; font-size:13px; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--line);}
.receiptkv{width:100%; border-collapse:collapse; font-size:12.5px;}
.receiptkv th{text-align:left; font-weight:600; padding:4px 10px 4px 0; white-space:nowrap; vertical-align:top;}
.receiptkv td{padding:4px 0;}
@media print{
  @page{margin:16mm;}
  .ptop,.pnav,.no-print,.toast-wrap,.langswitch,.flagrow{display:none !important;}
  .pbody{padding:0; max-width:none;}
  body{background:#fff;}
  .receipt{border:none; margin:0; padding:0; max-width:none;}
}
.pnav{position:sticky; bottom:0; background:var(--paper-raised); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px;}
.pnav .btn{flex:1; justify-content:center; padding:13px; min-height:48px;}
/* iOS Safari zooms the whole page in when a focused field's font-size is below
   16px. During a timed exam that zoom is disorienting and easy to get stuck in,
   so every field the candidate types into stays at 16px. */
input,select,textarea{font-size:16px;}
/* Comfortable touch targets on a phone. */
.qopt{min-height:48px; align-items:center;}
</style>
</head>
<body>
<div id="app"></div>
<script src="/exam/app.js"></script>
</body>
</html>
