<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LALCO Admin — Recruitment Platform</title>
<link rel="stylesheet" href="/shared.css">
<style>
.shell{display:flex; min-height:100vh;}
.sidebar{width:230px; flex-shrink:0; background:var(--ink); color:#E7ECF0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
.sidebar-brand{padding:20px; border-bottom:1px solid rgba(255,255,255,0.08); font-family:Georgia,serif; font-size:16px; font-weight:600; color:#fff;}
.sidebar-brand .sub{font-size:10.5px; color:#93a3b0; font-family:'Inter',sans-serif; font-weight:400;}
.sidebar-nav{flex:1; overflow-y:auto; padding:10px;}
.sidebar-nav a{display:flex; gap:10px; padding:9px 12px; margin:1px 0; border-radius:6px; color:#B9C4CE; text-decoration:none; font-size:13.2px; font-weight:500; cursor:pointer;}
.sidebar-nav a:hover{background:rgba(255,255,255,0.06); color:#fff;}
.sidebar-nav a.active{background:rgba(181,137,46,0.16); color:#F0DFB8;}
.sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:12px; color:#93a3b0;}
.sidebar-foot b{color:#dfe6ea; display:block; font-size:13px;}
.main{flex:1; min-width:0;}
.topbar{background:var(--paper-raised); border-bottom:1px solid var(--line); padding:14px 22px;}
.content{padding:22px; max-width:1300px; margin:0 auto;}
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--ink),#0A1B2C);}
.login-card{background:#fff; border-radius:12px; width:100%; max-width:400px; padding:32px;}
@media (max-width:900px){.sidebar{position:fixed; left:-240px; z-index:40; transition:left .18s;} .sidebar.open{left:0;} .content{padding:14px;}}

/* ---- Candidate language picker & bilingual question editor --------------
   The invitation language and the Lao side of a question are chosen here, so
   the admin can always see which field is English and which is Lao without
   reading JSON. Rows are finger-sized for HR working on a tablet. */
.langpick{display:flex; gap:10px; flex-wrap:wrap;}
.langopt{display:flex; align-items:center; gap:8px; min-height:44px; padding:6px 14px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--paper-raised);}
.langopt:has(input:checked){border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink);}
.bilrow{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.biltag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; padding:1px 6px; border-radius:4px; border:1px solid var(--line);}
.biltag.en{background:var(--paper); color:var(--ink);}
.biltag.lo{background:#FFF6E0; color:#6B4E00; border-color:#E4C97A;}
.optgrid{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
.optgrid th,.optgrid td{border:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:middle;}
.optgrid th{background:var(--paper); font-weight:600; text-transform:none; letter-spacing:0; white-space:nowrap;}
.optgrid input{width:100%; min-height:36px;}
.optgrid .canon{background:var(--paper); font-family:ui-monospace,Menlo,Consolas,monospace;}
@media (max-width:700px){.bilrow{grid-template-columns:1fr;}}

/* ---- Print report -------------------------------------------------------
   On screen the print view is an ordinary page. On paper the navigation,
   topbar and every control disappear and only the report remains. Lao and
   English are both rendered by the browser with the system fonts, so no
   embedded font is needed and neither script comes out as empty boxes. */
.printdoc{background:#fff; color:#000; padding:26px; border:1px solid var(--line); border-radius:8px; max-width:900px;}
.printhead{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; border-bottom:2px solid var(--ink); padding-bottom:10px;}
.printbrand{font-family:Georgia,serif; font-size:22px; font-weight:700; color:var(--ink); letter-spacing:.5px;}
.printh{font-family:Georgia,serif; font-size:13.5px; margin:18px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.6px;}
.printgrid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.printkv{width:100%; border-collapse:collapse; font-size:12px;}
.printtable{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;}
.printtable th,.printtable td{border:1px solid var(--line); padding:5px 7px; text-align:left;}
.printtable th,.printkv th{text-transform:none; letter-spacing:0; font-size:12px; color:#000; white-space:normal;}
.printtable th{background:var(--paper); font-weight:600;}
.printfoot{margin-top:22px; padding-top:8px; border-top:1px solid var(--line); font-size:10.5px;}
@media (max-width:700px){.printgrid{grid-template-columns:1fr;} .printdoc{padding:16px;}}

@media print{
  @page{margin:14mm;}
  .sidebar,.topbar,.no-print,.toast-wrap{display:none !important;}
  .shell{display:block;}
  .main{min-width:0;}
  .content{padding:0; max-width:none;}
  body{background:#fff;}
  .printdoc{border:none; border-radius:0; padding:0; max-width:none;}
  .printtable th{background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  /* Keep a section and its table on the same sheet where the paper allows. */
  .printh{break-after:avoid; page-break-after:avoid;}
  .printtable{break-inside:auto;}
  .printtable tr{break-inside:avoid; page-break-inside:avoid;}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/admin/app.js"></script>
</body>
</html>
